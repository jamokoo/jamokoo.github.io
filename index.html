<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Copy & Maps</title>
    <style>
        body { 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            gap: 15px; 
            font-family: sans-serif; 
            background: #f0f2f5; 
        }
        button { 
            padding: 20px 40px; 
            font-size: 24px; 
            font-weight: bold; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 80%; 
            max-width: 400px; 
            transition: opacity 0.2s;
        }
        button:disabled {
            background: #ccc !important;
            cursor: not-allowed;
        }
        #btn { background: #007bff; }
        #btn:active { background: #0056b3; }
        
        #mapBtn { background: #34a853; }
        #mapBtn:active { background: #2d8e47; }
    </style>
</head>
<body>

    <button id="btn">Tap to Copy Text</button>
    <button id="mapBtn">Google Maps</button>

    <script>
        const text = new URLSearchParams(window.location.search).get('copy');
        const copyBtn = document.getElementById('btn');
        const mapBtn = document.getElementById('mapBtn');

        // Copy functionality
        copyBtn.addEventListener('click', () => {
            if (text) {
                navigator.clipboard.writeText(text)
                    .then(() => { copyBtn.innerText = "Copied!"; })
                    .catch(() => { alert("Failed to copy. Ensure you are using HTTPS."); });
            } else {
                alert("Nothing to copy! Add ?copy=... to the URL.");
            }
        });

        // Google Maps functionality
        mapBtn.addEventListener('click', () => {
            if (text) {
                window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(text)}`, '_blank');
            } else {
                alert("No coordinates provided in the URL.");
            }
        });

        // Update UI if text is missing
        if (!text) {
            copyBtn.innerText = "No text provided";
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Copy & Maps</title>
    <style>
        body { 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            gap: 20px;
            margin: 0; 
            font-family: sans-serif; 
            background: #f0f2f5; 
        }
        button { 
            padding: 20px 40px; 
            font-size: 24px; 
            font-weight: bold; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 80%; 
            max-width: 400px; 
            transition: background 0.2s;
        }
        #btn { background: #007bff; }
        #btn:active { background: #0056b3; }
        
        #mapBtn { background: #34a853; } /* Google Green */
        #mapBtn:active { background: #2d8e47; }
        
        .hidden { display: none; }
    </style>
</head>
<body>

    <button id="btn">Tap to Copy Text</button>
    <button id="mapBtn" class="hidden">Google Maps</button>

    <script>
        const params = new URLSearchParams(window.location.search);
        const textToCopy = params.get('copy');
        const coords = params.get('coords');

        // Handle Copy Button
        const copyBtn = document.getElementById('btn');
        if (textToCopy) {
            copyBtn.addEventListener('click', () => {
                navigator.clipboard.writeText(textToCopy)
                    .then(() => { copyBtn.innerText = "Copied!"; })
                    .catch(() => { alert("Failed to copy. Ensure you are using HTTPS."); });
            });
        } else {
            copyBtn.innerText = "No text provided";
        }

        // Handle Google Maps Button
        const mapBtn = document.getElementById('mapBtn');
        if (coords) {
            mapBtn.classList.remove('hidden');
            mapBtn.addEventListener('click', () => {
                // Opens in a new tab with the coordinates
                window.open(`https://www.google.com/maps/search/?api=1&query=${coords}`, '_blank');
            });
        }
    </script>
</body>
</html>

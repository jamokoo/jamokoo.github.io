<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Copy & Maps</title>
    <style>
        body { 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            gap: 15px; 
            font-family: sans-serif; 
            background: #f0f2f5; 
        }
        button { 
            padding: 20px 40px; 
            font-size: 24px; 
            font-weight: bold; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 80%; 
            max-width: 400px; 
        }
        #btn { background: #007bff; }
        #btn:active { background: #0056b3; }
        
        #mapBtn { background: #34a853; }
        #mapBtn:active { background: #2d8e47; }
    </style>
</head>
<body>

    <button id="btn">Tap to Copy Text</button>
    <button id="mapBtn">Google Maps</button>

    <script>
        const text = new URLSearchParams(window.location.search).get('copy');
        const copyBtn = document.getElementById('btn');
        const mapBtn = document.getElementById('mapBtn');

        // Copy functionality
        copyBtn.addEventListener('click', () => {
            if (text) {
                navigator.clipboard.writeText(text)
                    .then(() => { copyBtn.innerText = "Copied!"; })
                    .catch(() => { alert("Failed to copy. Ensure you are using HTTPS."); });
            } else {
                alert("Nothing to copy!");
            }
        });

        // Google Maps functionality
        mapBtn.addEventListener('click', () => {
            if (text) {
                // 'z=15' sets the zoom level. 
                // Higher number = closer (21 is max), Lower number = further away (1 is world).
                const zoom = 14;
                const mapUrl = `https://www.google.com/maps?q=${encodeURIComponent(text)}&z=${zoom}`;
                
                window.open(mapUrl, '_blank');
            } else {
                alert("No coordinates provided.");
            }
        });

        if (!text) {
            copyBtn.innerText = "No text provided";
        }
    </script>
</body>
</html>

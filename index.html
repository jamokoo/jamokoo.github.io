<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Copy</title>
    <style>
        body { 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            font-family: sans-serif; 
            background: #f0f2f5; 
            gap: 20px; 
        }
        button { 
            padding: 20px 40px; 
            font-size: 24px; 
            font-weight: bold; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 80%; 
            max-width: 400px; 
        }
        #btn { background: #007bff; }
        #btn:active { background: #0056b3; }
        #mapBtn { background: #34a853; }
        #mapBtn:active { background: #2d8e47; }
    </style>
</head>
<body>
    <button id="btn">Tap to Copy Text</button>
    <button id="mapBtn">Google Maps</button>

    <script>
        const text = new URLSearchParams(window.location.search).get('copy');
        
        // Copy Button Logic
        const btn = document.getElementById('btn');
        if (text) {
            btn.addEventListener('click', () => {
                navigator.clipboard.writeText(text)
                    .then(() => { btn.innerText = "Copied!"; })
                    .catch(() => { alert("Failed to copy."); });
            });
        } else {
            btn.innerText = "No text provided";
        }

        // Google Maps Button Logic
        document.getElementById('mapBtn').addEventListener('click', () => {
            if (text) {
                // This uses your exact requested format
                // Change z=15 to a lower number (like 12) if it's still too close
                window.location.href = `https://maps.google.com/maps?q=${text}&z=14`;
            } else {
                alert("No coordinates provided.");
            }
        });
    </script>
</body>
</html>
